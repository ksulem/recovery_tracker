# Runs on the watering-system VM. Postgres is NOT defined here: the bot uses the
# watering-system "timescaledb" container (separate database "recovery"),
# reached over the external Docker network "pg-shared". See README → Deployment.
name: recovery

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-db-url: &db-url postgresql+asyncpg://recovery_app:${RECOVERY_DB_PASSWORD:?RECOVERY_DB_PASSWORD is required}@timescaledb:5432/recovery

services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    logging: *default-logging
    environment:
      DATABASE_URL: *db-url
    networks: [pg-shared]
    restart: "no"

  bot:
    build: .
    logging: *default-logging
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      OWNER_USER_ID: ${OWNER_USER_ID:?OWNER_USER_ID is required}
      DATABASE_URL: *db-url
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
    # Hard cap on a 1 GB VM shared with the watering stack: if this bot leaks,
    # it gets OOM-killed and restarted instead of pushing Postgres into swap.
    mem_limit: 160m
    restart: unless-stopped
    # Only pg-shared: the bot can reach Postgres and nothing else of the
    # watering stack (no MQTT broker, no API). No ports are published.
    networks: [pg-shared]

networks:
  pg-shared:
    external: true
